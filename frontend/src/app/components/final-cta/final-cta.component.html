<section class="final-cta">
  <div class="wrap">
    <div class="cta-banner">
      <span class="badge-pill" style="background:rgba(255,255,255,0.15);border-color:rgba(255,255,255,0.3);color:#fff;">🚀 Let's Go</span>
      <h2>Ready to turn ad spend<br>into pipeline?</h2>
      <div class="cta-row" style="justify-content:center;">
        <a class="btn" style="background:#fff;color:var(--primary-2);" [href]="chatConfig.whatsapp" target="_blank" rel="noopener"><img src="assets/icons/whatsapp.svg" alt="" class="btn-ico"> Chat on WhatsApp</a>
        <a class="btn" style="background:rgba(255,255,255,0.15);color:#fff;border:1.5px solid rgba(255,255,255,0.4);" [href]="chatConfig.telegram" target="_blank" rel="noopener"><img src="assets/icons/telegram.svg" alt="" class="btn-ico"> Chat on Telegram</a>
      </div>
    </div>
  </div>
</section>
