<!-- launcher: sits in the same fixed stack as the WhatsApp / Telegram buttons -->
<button
  type="button"
  class="ai-launcher"
  [class.is-open]="open"
  (click)="toggle()"
  [attr.aria-expanded]="open"
  aria-label="Open the GrowAds AI assistant">
  <svg *ngIf="!open" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
    <path fill="#FFFFFF" d="M12 2.5l1.6 4.5 4.5 1.6-4.5 1.6L12 14.7l-1.6-4.5-4.5-1.6 4.5-1.6L12 2.5z"/>
    <path fill="#FFFFFF" opacity="0.85" d="M18.5 13.5l.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9.9-2.4z"/>
    <path fill="#FFFFFF" opacity="0.7" d="M5.5 14l.7 1.9 1.9.7-1.9.7-.7 1.9-.7-1.9-1.9-.7 1.9-.7.7-1.9z"/>
  </svg>
  <svg *ngIf="open" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
    <path fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/>
  </svg>
</button>

<div class="ai-panel" *ngIf="open" role="dialog" aria-label="GrowAds AI assistant">
  <header class="ai-head">
    <div class="ai-head-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18">
        <path fill="#FFFFFF" d="M12 2.5l1.6 4.5 4.5 1.6-4.5 1.6L12 14.7l-1.6-4.5-4.5-1.6 4.5-1.6L12 2.5z"/>
      </svg>
    </div>
    <div class="ai-head-text">
      <strong>GrowAds Assistant</strong>
      <span>Answers in seconds · powered by AI</span>
    </div>
    <button type="button" class="ai-close" (click)="close()" aria-label="Close chat">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </header>

  <div class="ai-body" #scroller>
    <div *ngFor="let m of messages" class="ai-msg" [class.is-user]="m.role === 'user'">
      <div class="ai-bubble">{{ m.content }}</div>
    </div>

    <div class="ai-suggest" *ngIf="!started && !loading">
      <button type="button" *ngFor="let s of suggestions" (click)="ask(s)">{{ s }}</button>
    </div>

    <div class="ai-msg" *ngIf="loading">
      <div class="ai-bubble ai-typing" aria-label="Assistant is typing">
        <span></span><span></span><span></span>
      </div>
    </div>

    <p class="ai-error" *ngIf="error">{{ error }}</p>
  </div>

  <form class="ai-input" (ngSubmit)="send()">
    <textarea
      #field
      rows="1"
      maxlength="1500"
      placeholder="Ask me anything…"
      [(ngModel)]="draft"
      name="draft"
      (keydown.enter)="onEnter($event)"></textarea>
    <button type="submit" [disabled]="loading || !draft.trim()" aria-label="Send message">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path fill="#FFFFFF" d="M3.4 20.4l18-8.4-18-8.4 0 6.5 12.9 1.9-12.9 1.9z"/>
      </svg>
    </button>
  </form>

  <p class="ai-note">AI-generated · for exact pricing, message us on WhatsApp or Telegram.</p>
</div>
